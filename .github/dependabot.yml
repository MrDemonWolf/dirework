version: 2

updates:
  # GitHub Actions are SHA-pinned, so they cannot pick up security fixes on
  # their own — Dependabot is what keeps those pins moving (it rewrites the SHA
  # and the trailing # vN comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
    groups:
      # init and analyze must share one SHA, so they move in a single PR.
      codeql:
        patterns:
          - "github/codeql-action*"

  # The bun ecosystem reads bun.lock and edits the root package.json catalog
  # pins, but bumps packages one at a time — families that must move in
  # lockstep need a group below. The scheduled audit workflow flags any pin
  # that turns vulnerable.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per ecosystem cluster instead of a swarm of single-package PRs.
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "turbo"
          - "tsx"
      cloudflare:
        patterns:
          - "alchemy"
          - "wrangler"
          - "@opennextjs/*"
          - "@cloudflare/*"
      # @trpc/client requires the exact same @trpc/server version, and
      # @trpc/tanstack-react-query depends on both — a lone bump leaves a
      # nested, skewed copy, so all @trpc/* packages move in one PR.
      trpc:
        patterns:
          - "@trpc/*"
      # fumadocs-ui pins fumadocs-core to its own exact version and fumadocs-mdx
      # requires a minimum fumadocs-core, so a lone bump of one of them fails the
      # docs type check (a skewed or second fumadocs-core copy).
      fumadocs:
        patterns:
          - "fumadocs-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"

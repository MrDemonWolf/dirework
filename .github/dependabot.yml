version: 2

updates:
  # GitHub Actions are SHA-pinned, so they cannot pick up security fixes on
  # their own — Dependabot is what keeps those pins moving (it rewrites the SHA
  # and the trailing # vN comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
    groups:
      # init and analyze must share one SHA, so they move in a single PR.
      codeql:
        patterns:
          - "github/codeql-action*"

  # The bun ecosystem reads bun.lock. It skips `catalog:` entries, so catalog
  # pins in the root package.json are bumped by hand; the scheduled audit
  # workflow flags any that turn vulnerable.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per ecosystem cluster instead of a swarm of single-package PRs.
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "turbo"
          - "tsx"
      cloudflare:
        patterns:
          - "alchemy"
          - "wrangler"
          - "@opennextjs/*"
          - "@cloudflare/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"

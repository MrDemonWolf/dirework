name: Dependency audit

# GitHub's dependency graph does not read bun.lock or `catalog:` versions, so
# Dependabot alerts and dependency-review miss most advisories. This runs the
# same lockfile audit as verify.yml on a schedule, so a newly published advisory
# fails a run (and notifies the owner) without waiting for the next push.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run audit:dependencies

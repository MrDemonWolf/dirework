name: Build and deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  build:
    # Forks have no Pages site (and would publish upstream's canonical domain);
    # skipping build also skips deploy.
    if: github.repository == 'mrdemonwolf/dirework'
    uses: ./.github/workflows/verify.yml
    with:
      upload-docs: true
      # Warn-only audit on deploys (see deploy.yml); PRs still block on it.
      audit-blocking: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

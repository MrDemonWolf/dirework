name: Verify

# Reusable verification pipeline — the single definition of "is this code OK".
# CI and Deploy both call it, so the deploy gate can never drift from the PR
# gate (previously each workflow re-implemented install/typecheck/test/build).
on:
  workflow_call:
    inputs:
      run-build:
        description: Also run the production build (slower; required before deploying).
        type: boolean
        default: true
      upload-docs:
        description: Build and upload the verified GitHub Pages site.
        type: boolean
        default: false
      audit-blocking:
        description: >-
          Fail on high-severity dependency advisories. True for the PR/push gate
          (ci.yml); the deploy workflows pass false so an advisory published
          today can't block a revert or hotfix — they get a warning annotation.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Blocking on the PR gate. Non-blocking on deploys: the step still runs
      # and surfaces a ::warning:: annotation, but a new upstream advisory must
      # never stop shipping a revert. ci.yml + audit.yml keep the hard gate.
      - name: Audit dependencies
        continue-on-error: ${{ !inputs.audit-blocking }}
        env:
          AUDIT_BLOCKING: ${{ inputs.audit-blocking }}
        run: |
          if bun run audit:dependencies; then exit 0; fi
          if [ "$AUDIT_BLOCKING" = "true" ]; then exit 1; fi
          echo "::warning title=Dependency audit::High-severity advisories found. Deploy continues (audit is non-blocking on deploy); fix them in a PR, where the audit still blocks."
      - name: Lint + format check
        run: bun run lint
      - name: Design tokens drift check
        run: bun run tokens && git diff --exit-code
      - name: Type check
        run: bun run check-types
      - name: Test with coverage thresholds
        run: bun run test:coverage
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
        if: ${{ inputs.upload-docs }}
        id: pages
      - name: Production build
        if: ${{ inputs.run-build || inputs.upload-docs }}
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build --filter='!web'
      # The web app is built exactly as the deploy builds it (OpenNext + wasm
      # fix + cache population) instead of a plain `next build`, so a failure in
      # that pipeline stops here — not mid-deploy, after D1 migrations and the
      # new api worker are already live. OpenNext runs `next build` itself.
      - name: Production Worker build (web)
        if: ${{ inputs.run-build || inputs.upload-docs }}
        working-directory: apps/web
        run: bun run build:worker
      # A worker can build cleanly and still throw on every request at runtime
      # (Next 16.4 under OpenNext 1.20.9 did, in production). Boot the built
      # bundle in local workerd and request routes that need no api worker.
      - name: Web Worker runtime smoke check
        if: ${{ inputs.run-build || inputs.upload-docs }}
        working-directory: apps/web
        run: bun run smoke:worker
      # Browser end-to-end tests (packages/e2e): the api worker from source and the
      # web bundle built above, both in local workerd over a fresh local D1 with
      # every migration applied, signed in through the DEV_LOGIN bypass and driven
      # by Playwright. Same gate for a PR and a deploy.
      - name: Install Playwright browser
        if: ${{ inputs.run-build }}
        run: bun run e2e:install
      - name: Browser end-to-end tests
        if: ${{ inputs.run-build }}
        run: bun run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() && inputs.run-build }}
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: ${{ inputs.upload-docs }}
        with:
          path: apps/fumadocs/out

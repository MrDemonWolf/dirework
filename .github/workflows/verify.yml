name: Verify

# Reusable verification pipeline — the single definition of "is this code OK".
# CI and Deploy both call it, so the deploy gate can never drift from the PR
# gate (previously each workflow re-implemented install/typecheck/test/build).
on:
  workflow_call:
    inputs:
      run-build:
        description: Also run the production build (slower; required before deploying).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run audit:dependencies
      - name: Lint + format check
        run: bun run lint
      - name: Type check
        run: bun run check-types
      - name: Test with coverage thresholds
        run: bun run test:coverage
      - name: Production build
        if: ${{ inputs.run-build }}
        run: bun run build

name: Verify

# Reusable verification pipeline — the single definition of "is this code OK".
# CI and Deploy both call it, so the deploy gate can never drift from the PR
# gate (previously each workflow re-implemented install/typecheck/test/build).
on:
  workflow_call:
    inputs:
      run-build:
        description: Also run the production build (slower; required before deploying).
        type: boolean
        default: true
      upload-docs:
        description: Build and upload the verified GitHub Pages site.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run audit:dependencies
      - name: Lint + format check
        run: bun run lint
      - name: Type check
        run: bun run check-types
      - name: Test with coverage thresholds
        run: bun run test:coverage
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
        if: ${{ inputs.upload-docs }}
        id: pages
      - name: Production build
        if: ${{ inputs.run-build || inputs.upload-docs }}
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: ${{ inputs.upload-docs }}
        with:
          path: apps/fumadocs/out

name: Release

# Turns a pushed `vX.Y.Z` tag into a GitHub Release whose notes are that version's
# CHANGELOG.md section (packages/infra/release-notes.ts). The script refuses a tag whose
# version apps/web/package.json does not carry, so notes and code cannot disagree. Runs
# only on the upstream repo: forks tag their own history.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'mrdemonwolf/dirework'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # node:fs only, so no install step: the notes come straight from the checkout.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: bun packages/infra/release-notes.ts "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "DireWork $TAG" --notes-file "$RUNNER_TEMP/notes.md"

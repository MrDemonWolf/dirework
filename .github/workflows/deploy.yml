name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_state_token:
        description: "One-time recovery: overwrite the shared alchemy-state worker's token with ALCHEMY_STATE_TOKEN. Leave false for normal deploys."
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # Alchemy runs under Node via tsx — Bun segfaults on the Alchemy program.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      # Shared across every MrDemonWolf Alchemy app — auths the alchemy-state store.
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      # One-time recovery switch — true only when manually dispatched with the
      # force_state_token input. Normal push deploys leave it false so the state
      # worker's token is never needlessly rewritten. See packages/infra/alchemy.run.ts.
      ALCHEMY_STATE_FORCE_UPDATE: ${{ inputs.force_state_token || false }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Deploy via Alchemy (Node + tsx)
        working-directory: packages/infra
        run: npx -y tsx alchemy.run.ts

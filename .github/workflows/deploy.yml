name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # Alchemy runs under Node via tsx — Bun segfaults on the Alchemy program.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BETTER_AUTH_URL: "https://dirework.mrdemonwolf.workers.dev"
      CORS_ORIGIN: "https://dirework.mrdemonwolf.workers.dev"
      SKIP_ENV_VALIDATION: "true"
      # Alchemy refuses the default local state store in CI (orphan-infra guard).
      # Named resources (D1/Workers) are adopted by name on re-deploy, so a
      # non-persistent per-run state file is safe here — same as wolfathon.
      ALCHEMY_CI_STATE_STORE_CHECK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Deploy via Alchemy (Node + tsx)
        working-directory: packages/infra
        run: npx -y tsx alchemy.run.ts

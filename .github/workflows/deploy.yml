name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_state_token:
        description: "One-time recovery: overwrite the shared alchemy-state worker's token with ALCHEMY_STATE_TOKEN. Leave false for normal deploys."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The same reusable pipeline the PR gate runs, build included — a deploy must
  # never ship code that could not be built.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      run-build: true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SKIP_ENV_VALIDATION: "true"
    steps:
      # Checkout, runtime setup, and dependency installation deliberately have
      # no production credentials in their environment. A compromised install
      # script must not be able to read deployment secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # Validate presence, secret length, same-origin HTTPS URLs, optional
      # external URLs, and that the development login bypass is disabled.
      - name: Validate production deploy configuration
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_SERVICE_URL: ${{ vars.TERMS_OF_SERVICE_URL }}
        run: node ./node_modules/.bin/tsx validate-deploy-env.ts

      # Alchemy MUST run under Node — Bun segfaults on the Alchemy program.
      # Use the lockfile-pinned local tsx; never fetch an executable with npx.
      - name: Deploy via Alchemy (Node + tsx)
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ inputs.force_state_token || false }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_SERVICE_URL: ${{ vars.TERMS_OF_SERVICE_URL }}
        run: node ./node_modules/.bin/tsx alchemy.run.ts
